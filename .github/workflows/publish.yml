on:
  push:
    branches: [main]

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        run: python etl/housing_prices.py

      - name: Install X-13ARIMA-SEATS
        run: |
          mkdir -p "$RUNNER_TEMP/x13as"
          curl -sSL https://www2.census.gov/software/x-13arima-seats/x13as/unix-linux/program-archives/x13as_ascii-v1-1-b62.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/x13as"
          # statsmodels looks for an executable called x13as in X13PATH.
          bin=$(find "$RUNNER_TEMP/x13as" -type f -name 'x13as*' ! -name '*.*' | head -n 1)
          chmod +x "$bin"
          dir=$(dirname "$bin")
          [ "$(basename "$bin")" = x13as ] || ln -s "$bin" "$dir/x13as"
          echo "X13PATH=$dir" >> "$GITHUB_ENV"

      - name: Run seasonality analysis
        run: python etl/housing_seasonality.py

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
